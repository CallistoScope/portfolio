<main class="home-page">
    <app-home-hero />
    <app-featured-projects [projects]="store.featuredProjects()" />
    <app-home-experience [experience]="store.experience()" />
    <!-- <app-home-skills [groups]="store.skillGroups()" /> -->
    <app-home-cta />
</main>

<div class="parallax-container">
    <div class="floating-image" [style.scale]="store.parallaxScale()" [style.opacity]="store.parallaxOpacity()">
        <div class="logo-wrap ani-show" style="animation-delay: 0.1s">
            <img class="logo-top" src="/assets/logo/escobedev-top.svg" width="350px" alt="Escobedev Top">
            <img class="logo-bottom" src="/assets/logo/escobedev-bottom.svg" width="350px" alt="Escobedev Right">
            <img class="logo-left" src="/assets/logo/escobedev-left.svg" width="350px" alt="Escobedev Letf">
        </div>
    </div>
</div>
