<a class="card" [routerLink]="['/projects', project().slug]">
    <div class="preview">

        <img [ngSrc]="image()" fill alt="Project screenshot" loading="lazy" />

        <div class="preview__overlay">
            <span class="preview__action">
                View project
                <span aria-hidden="true">↗</span>
            </span>
        </div>
    </div>

    <div class="content">
        <div class="meta">
            <span>{{ project().category }}</span>
            <span>·</span>
            <span>{{ project().platforms.join(' · ') }}</span>
        </div>

        <h2>{{ project().name }}</h2>

        <p>{{ project().description }}</p>

        <app-project-tags [project]="project()" [limit]="4" />

        <div class="footer">
            <span>View project</span>
            <span aria-hidden="true">→</span>
        </div>
    </div>
</a>
